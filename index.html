<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canteen Pre-Order System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>
        <div class="logo">
            🍴 Campus Canteen
        </div>

        <nav>
            <a href="#home">Home</a>
            <a href="#menu">Menu</a>
            <a href="#order">Pre-Order</a>
            <button onclick="openCart()" class="cart-btn">
                🛒 Cart <span id="cartCount">0</span>
            </button>
        </nav>
    </header>


    <!-- ================= HOME ================= -->

    <section id="home" class="hero">

        <div class="hero-content">

            <h1>Campus Canteen</h1>

            <p>
                Order your favourite food in advance
                and skip the queue!
            </p>

            <a href="#menu" class="primary-btn">
                Order Now
            </a>

        </div>

    </section>


    <!-- ================= MENU ================= -->

    <section id="menu" class="menu-section">

        <h2>Our Menu</h2>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search food..."
                onkeyup="searchFood()"
            >
        </div>

        <div class="category-buttons">

            <button onclick="filterFood('all')">
                All
            </button>

            <button onclick="filterFood('breakfast')">
                Breakfast
            </button>

            <button onclick="filterFood('lunch')">
                Lunch
            </button>

            <button onclick="filterFood('snacks')">
                Snacks
            </button>

            <button onclick="filterFood('drinks')">
                Drinks
            </button>

        </div>

        <div id="foodContainer" class="food-container">
            <!-- Food items generated by JavaScript -->
        </div>

    </section>


    <!-- ================= ORDER SECTION ================= -->

    <section id="order" class="order-section">

        <h2>Pre-Order</h2>

        <div class="order-form">

            <label for="studentName">
                Student Name
            </label>

            <input
                type="text"
                id="studentName"
                placeholder="Enter your name"
            >


            <label for="studentId">
                Student ID
            </label>

            <input
                type="text"
                id="studentId"
                placeholder="Enter your student ID"
            >


            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter phone number"
            >
			


    <!-- Order Type -->
    <label>Order Type</label>
    <select id="orderType">
        <option value="">Select Order Type</option>
        <option value="Pickup">Pickup</option>
        <option value="Delivery">Delivery</option>
    </select>
<div id="pickupDetails">

    <label>Pickup Time</label>
    <select id="pickupTime">
        <option value="">Select pickup time</option>
        <option>10:00 AM</option>
        <option>11:00 AM</option>
        <option>12:00 PM</option>
        <option>01:00 PM</option>
        <option>02:00 PM</option>
        <option>03:00 PM</option>
    </select>

    <label>Pickup Status</label>
    <select id="pickupStatus">
        <option>Order Placed</option>
        <option>Confirmed</option>
        <option>Preparing</option>
        <option>Ready for Pickup</option>
        <option>Collected</option>
    </select>

</div>


<div id="deliveryDetails">

    <label>Delivery Time</label>
    <input type="time" id="deliveryTime">

    <label>Delivery Status</label>
    <select id="deliveryStatus">
        <option>Order Placed</option>
        <option>Confirmed</option>
        <option>Preparing</option>
        <option>Out for Delivery</option>
        <option>Delivered</option>
    </select>

</div>


    <!-- Payment -->
    <label>Payment Method</label>
    <select id="paymentMethod">
        <option value="">Select Payment Method</option>
        <option value="Cash on Pickup">Cash on Pickup</option>
		<option value="Cash on Delivery">Cash on Delivery</option>
        <option value="UPI">UPI</option>
        <option value="Debit/Credit Card">Debit/Credit Card</option>
    </select>
	
	
	
    <!-- Your existing button -->
		<button type="button" onclick="placeOrder()" class="place-order-btn">
				Place Pre-Order
		</button>


  

</div>



        </div>

    </section>


    <!-- ================= CART ================= -->

    <div id="cartModal" class="modal">

        <div class="cart-content">

            <span
                class="close"
                onclick="closeCart()"
            >
                &times;
            </span>

            <h2>🛒 Your Cart</h2>

            <div id="cartItems">
                <!-- Cart items -->
            </div>

            <div class="cart-total">

                <h3>
                    Total:
                    ₹<span id="cartTotal">0</span>
                </h3>

                <button
                    onclick="goToOrder()"
                    class="checkout-btn"
                >
                    Proceed to Pre-Order
                </button>

            </div>

        </div>

    </div>


    <!-- ================= SUCCESS MESSAGE ================= -->

    <div id="successModal" class="modal">

        <div class="success-content">

            <h1>🎉 Order Successful!</h1>

            <p>
                Your pre-order has been placed successfully.
            </p>

            <h2>
                Order No:
                <span id="orderNumber"></span>
            </h2>

            <p id="orderDetails"></p>

            <button
                onclick="closeSuccess()"
                class="primary-btn"
            >
                Done
            </button>

        </div>

    </div>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 Campus Canteen | Canteen Pre-Order System
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
